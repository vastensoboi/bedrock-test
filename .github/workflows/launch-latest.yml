name: Build latest launch test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        id: unpack
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import hashlib, os, re, zipfile
          candidates = []
          for path in sorted(Path('.').glob('bedrock-launch*.zip')):
              try:
                  with zipfile.ZipFile(path) as archive:
                      config = archive.read('app/build.gradle').decode('utf-8')
                  if not re.search(r"applicationId\s+['\"]dev\.custom\.bedrocklaunchtest['\"]", config):
                      continue
                  code = re.search(r'versionCode\s+(\d+)', config)
                  version = re.search(r"versionName\s+['\"]([0-9]+(?:\.[0-9]+)*)['\"]", config)
                  if code and version:
                      candidates.append((int(code[1]), version[1], path))
              except (OSError, KeyError, UnicodeError, zipfile.BadZipFile):
                  print('Skipping unreadable source archive:', path)
          if not candidates:
              raise SystemExit('Upload the new bedrock-launch source ZIP to the repository root first')
          highest = max(c[0] for c in candidates)
          latest = [c for c in candidates if c[0] == highest]
          if len({hashlib.sha256(c[2].read_bytes()).digest() for c in latest}) != 1:
              raise SystemExit('Different archives share the highest versionCode. Keep only the intended latest source')
          code, version, source = latest[0]
          print('Using:', source, 'version:', version, 'versionCode:', code)
          with zipfile.ZipFile(source) as archive:
              archive.extractall('project')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + version + '\n')
          PYCODE
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platforms;android-35 build-tools;35.0.0'
      - name: Test preparation
        working-directory: project
        run: |
          mkdir -p /tmp/probe-tests
          javac -d /tmp/probe-tests app/src/main/java/dev/custom/bedrockgui/GameArchiveCache.java tests/ArchiveTest.java
          java -cp /tmp/probe-tests ArchiveTest
      - name: Test resource names
        working-directory: project
        run: |
          mkdir -p /tmp/resource-tests
          javac -d /tmp/resource-tests app/src/main/java/dev/custom/bedrockgui/ResourceNames.java tests/ResourceNamesTest.java
          java -cp /tmp/resource-tests ResourceNamesTest
      - name: Test native trace reader
        working-directory: project
        run: |
          mkdir -p /tmp/tombstone-tests
          javac -d /tmp/tombstone-tests app/src/main/java/dev/custom/bedrockgui/TombstoneSummary.java tests/TombstoneTest.java
          java -cp /tmp/tombstone-tests TombstoneTest
      - name: Build APK
        working-directory: project
        run: gradle --no-daemon :app:assembleDebug
      - name: Check runtime superclass is not replaced by a stub
        run: |
          apkanalyzer dex packages --defined-only project/app/build/outputs/apk/debug/app-debug.apk > /tmp/apk-classes.txt
          python3 -c 'from pathlib import Path; names={line.split()[-1] for line in Path("/tmp/apk-classes.txt").read_text().splitlines() if line.split()}; assert "com.mojang.minecraftpe.MainActivity" not in names, "Compile-only game stub must not be packaged"'
      - name: Name APK
        run: cp project/app/build/outputs/apk/debug/app-debug.apk BedrockLaunchTest-${{ steps.unpack.outputs.version }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BedrockLaunchTest-${{ steps.unpack.outputs.version }}
          path: BedrockLaunchTest-${{ steps.unpack.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 7
