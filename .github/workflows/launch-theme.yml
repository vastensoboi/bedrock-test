name: Build launch test theme fix
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack and apply theme fix
        run: |
          mkdir project
          unzip -q bedrock-launch-test-source.zip -d project
          python3 - <<'PY'
          from pathlib import Path
          root=Path("project")
          p=root/"app/src/main/java/dev/custom/bedrockgui/GameRuntime.java"
          s=p.read_text()
          s=s.replace("getClassLoadingLock(name)", "this")
          p.write_text(s)
          p=root/"app/src/main/java/dev/custom/bedrockgui/HostedGameActivity.java"
          s=p.read_text()
          old="super.onCreate(state);"
          assert s.count(old)==1, "Unexpected HostedGameActivity source"
          s=s.replace(old, "String gamePackage = \"com.mojang.minecraftpe\";\n            android.content.pm.ActivityInfo original = getPackageManager().getActivityInfo(\n                    new ComponentName(gamePackage, gamePackage + \".MainActivity\"), 0);\n            int originalTheme = original.getThemeResource();\n            if (originalTheme == 0) throw new IllegalStateException(\"Minecraft Activity has no theme\");\n            GameRuntime.log(\"Activity: applying original game theme \" +\n                    getResources().getResourceName(originalTheme) + \" / 0x\" + Integer.toHexString(originalTheme));\n            setTheme(originalTheme);\n            super.onCreate(state);")
          s=s.replace("catch(RuntimeException|LinkageError error)", "catch(Exception|LinkageError error)")
          p.write_text(s)
          p=root/"app/build.gradle"
          s=p.read_text().replace("versionCode 1","versionCode 2").replace("versionName '0.2'","versionName '0.3'")
          p.write_text(s)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platforms;android-35 build-tools;35.0.0'
      - name: Test preparation
        working-directory: project
        run: |
          mkdir -p /tmp/probe-tests
          javac -d /tmp/probe-tests app/src/main/java/dev/custom/bedrockgui/GameArchiveCache.java tests/ArchiveTest.java
          java -cp /tmp/probe-tests ArchiveTest
      - name: Build APK
        working-directory: project
        run: gradle --no-daemon :app:assembleDebug
      - name: Check compile-only stub
        run: |
          apkanalyzer dex packages --defined-only project/app/build/outputs/apk/debug/app-debug.apk > /tmp/apk-classes.txt
          python3 -c 'from pathlib import Path; names={line.split()[-1] for line in Path("/tmp/apk-classes.txt").read_text().splitlines() if line.split()}; assert "com.mojang.minecraftpe.MainActivity" not in names, "Game stub must not be packaged"'
      - name: Name APK
        run: cp project/app/build/outputs/apk/debug/app-debug.apk BedrockLaunchTest-themefix.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BedrockLaunchTest-ThemeFix
          path: BedrockLaunchTest-themefix.apk
          if-no-files-found: error
          retention-days: 7
