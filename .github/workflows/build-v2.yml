name: Build diagnostic APK v2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: |
          test -f bedrock-diagnostic-source.zip
          mkdir project
          unzip -q bedrock-diagnostic-source.zip -d project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Test archive preparation
        working-directory: project
        run: |
          mkdir -p /tmp/probe-tests
          javac -d /tmp/probe-tests app/src/main/java/dev/custom/bedrockgui/GameArchiveCache.java tests/ArchiveTest.java
          java -cp /tmp/probe-tests ArchiveTest
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platforms;android-35 build-tools;35.0.0' 
      - name: Build APK
        working-directory: project
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BedrockDiagnostic-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
